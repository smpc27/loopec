name: Build Mobile Apps (Android APK & iOS)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: 21

      - name: Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Stage Android APK for Release
        run: |
          mkdir -p dist-mobile
          cp android/app/build/outputs/apk/debug/app-debug.apk dist-mobile/LOOPEC-Campus-Android.apk

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: LOOPEC-Android-Debug-APK
          path: dist-mobile/LOOPEC-Campus-Android.apk
          if-no-files-found: error
          retention-days: 30

  ios-package:
    name: Build iOS Package
    runs-on: macos-14
    continue-on-error: true

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Sync Capacitor iOS
        run: npx cap sync ios

      - name: Build iOS App with Xcode
        run: |
          cd ios/App
          xcodebuild -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ./build/DerivedData \
            build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package Unsigned IPA
        run: |
          mkdir -p dist-mobile/Payload
          APP_PATH=$(find ios/App/build/DerivedData -name "App.app" -type d | head -n 1)
          if [ -n "$APP_PATH" ]; then
            echo "Found App.app at $APP_PATH"
            cp -r "$APP_PATH" dist-mobile/Payload/
            cd dist-mobile
            zip -r LOOPEC-Campus-iOS.ipa Payload
          else
            echo "App.app not found"
            exit 1
          fi

      - name: Upload iOS App Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LOOPEC-iOS-App-IPA
          path: dist-mobile/LOOPEC-Campus-iOS.ipa
          if-no-files-found: warn
          retention-days: 30

  publish-release:
    name: Publish Mobile Release
    needs: [android-apk, ios-package]
    if: always() && (needs.android-apk.result == 'success' || needs.ios-package.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Android Artifact
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: LOOPEC-Android-Debug-APK
          path: release-assets

      - name: Download iOS Artifact
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: LOOPEC-iOS-App-IPA
          path: release-assets

      - name: List Release Assets
        run: ls -la release-assets

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v1.0.0-mobile
          name: "LOOPEC Mobile v1.0.0 (Android APK & iOS IPA)"
          body: |
            ## 📱 LOOPEC Campus Marketplace — Mobile App Packages

            Official mobile binaries compiled directly from the LOOPEC master repository.

            ### Downloads:
            - **Android (`.apk`):** Download `LOOPEC-Campus-Android.apk` and tap to install on any Android phone (enable "Install unknown apps" in Settings).
            - **iOS (`.ipa`):** Download `LOOPEC-Campus-iOS.ipa` and sideload via AltStore, Sideloadly, or deploy to TestFlight / Apple Developer Account.

            ### Highlights:
            - Connected to live verified campus portal: `https://loopec-2w2s-the-restarters.vercel.app`
            - Mobile-optimized authentication view (login on top, trust showcase below)
            - Signature warm linen (`#eee9e2`), sand gold (`#d0c1ab`), and espresso theme
            - 100% verified college peer-to-peer commerce
          files: release-assets/*
          prerelease: false
