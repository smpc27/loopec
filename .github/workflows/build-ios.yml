name: Build iOS Package

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build LOOPEC iOS App
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Node Dependencies
        run: npm ci

      - name: Sync Capacitor iOS
        run: npx cap sync ios

      - name: Build Xcode Project
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath ./build/App.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Create Unsigned IPA Package
        run: |
          mkdir -p ios/App/build/Payload
          cp -r ios/App/build/App.xcarchive/Products/Applications/App.app ios/App/build/Payload/
          cd ios/App/build
          zip -r LOOPEC-iOS-Unsigned.ipa Payload

      - name: Upload iOS App Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LOOPEC-iOS-App-IPA
          path: ios/App/build/LOOPEC-iOS-Unsigned.ipa
          if-no-files-found: warn
          retention-days: 30
