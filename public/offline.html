<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#eee9e2" />
    <title>LOOPEC — You’re offline</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #eee9e2; color: #241e14; font: 16px/1.7 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      main { max-width: 460px; padding: 38px; border: 1px solid #d0c1ab; border-radius: 26px; background: #ffffff; box-shadow: 0 20px 50px -20px rgba(36, 30, 20, 0.12); }
      .mark { display: grid; place-items: center; width: 46px; height: 46px; margin-bottom: 24px; border-radius: 14px; background: #eee9e2; color: #241e14; font-size: 21px; font-weight: 700; }
      h1 { margin: 0 0 12px; font-size: 26px; line-height: 1.25; }
      p { color: #736b60; font-size: 14px; margin: 0; }
      a { display: inline-flex; margin-top: 20px; padding: 12px 20px; border-radius: 999px; background: #241e14; color: #eee9e2; font-size: 13px; font-weight: 700; text-decoration: none; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">↻</div>
      <h1>You’re out of the loop for a moment.</h1>
      <p>LOOPEC needs an internet connection to load the latest campus marketplace. Check your connection and try again.</p>
      <a href="/">Try again</a>
    </main>
  </body>
</html>
